name: Python syntax check

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "physics/**"
      - "ui/**"
      - ".github/workflows/python-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and physics modules
        run: python -m compileall -q app.py physics ui
