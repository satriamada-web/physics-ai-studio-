name: Physics AI Studio tests

on:
  push:
    branches:
      - main
      - integrate-flow-engine
  pull_request:
    branches:
      - main
      - integrate-flow-engine
  workflow_dispatch:

jobs:
  geometry-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3.0"

      - name: Run imported geometry pipeline tests
        run: python -m unittest discover -s tests -v
