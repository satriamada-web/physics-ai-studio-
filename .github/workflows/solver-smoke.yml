name: Solver smoke tests

on:
  push:
    branches: [main]
    paths:
      - "physics/**"
      - ".github/workflows/solver-smoke.yml"
  workflow_dispatch:

jobs:
  solver-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependency
        run: python -m pip install "numpy>=1.26,<3.0"
      - name: Verify 2D, 3D, mesh, and worker behavior
        run: |
          python - <<'PY'
          import time
          import numpy as np
          from physics.heat_transfer import solve_steady_state, solve_transient
          from physics.heat_transfer_3d import solve_steady_state_3d, solve_transient_3d
          from physics.mesh_3d import create_structured_mesh
          from physics.volume_mesh_3d import create_voxel_volume_mesh
          from physics.wind_heat_3d import solve_wind_heat_transport
          from physics.room_domain_3d import create_room_domain, subtract_solid_obstacle
          from physics.worker import submit_job, get_job, cancel_job

          b2 = {"left": 25.0, "right": 25.0, "top": 25.0, "bottom": 25.0}
          s2 = solve_steady_state(5, 5, 1.0, 1.0, 10.0, 0.0, b2)
          assert np.allclose(s2["temperature"], 25.0)
          t2 = solve_transient(5, 5, 1.0, 1.0, 10.0, 1000.0, 500.0, 0.0,
                               b2, 25.0, 0.01, 0.001)
          assert np.allclose(t2["temperature"], 25.0)

          b3 = {k: 25.0 for k in ("x_min", "x_max", "y_min", "y_max", "z_min", "z_max")}
          s3 = solve_steady_state_3d(3, 3, 3, 1.0, 1.0, 1.0, 10.0, 0.0, b3)
          assert np.allclose(s3["temperature"], 25.0)
          t3 = solve_transient_3d(3, 3, 3, 1.0, 1.0, 1.0, 10.0, 1000.0, 500.0,
                                  0.0, b3, 25.0, 0.01, 0.001)
          assert np.allclose(t3["temperature"], 25.0)

          mesh = create_structured_mesh(3, 4, 5, 1.0, 2.0, 3.0)
          assert mesh["shape_zyx"] == (5, 4, 3)

          # Isolated regular voxel-domain test for the wind/thermal transport kernel.
          mask = np.ones((8, 8, 8), dtype=bool)
          wind = solve_wind_heat_transport(
              mask, 0.125, 0.125, 0.125,
              1.0, 0.0, 0.0, 40.0, 20.0, total_time=0.05, snapshot_count=3,
          )
          assert wind["velocity_m_s"][0] > 0.99
          assert wind["inlet_cell_count"] == 64
          assert np.allclose(wind["temperature"][:, :, 0], 40.0)
          assert np.nanmax(wind["temperature"]) > 20.0

          room = create_room_domain(
              6.0, 4.0, 3.0, 12, 8, 6,
              "x_min", "x_max", 0.5, 0.5,
          )
          assert room["inside_mask_zyx"].shape == (6, 8, 12)
          assert room["inlet_cell_count"] > 0
          assert room["outlet_cell_count"] == room["inlet_cell_count"]
          room_wind = solve_wind_heat_transport(
              room["inside_mask_zyx"], room["dx"], room["dy"], room["dz"],
              1.0, 0.0, 0.0, 38.0, 24.0, total_time=0.05,
              inlet_mask_zyx=room["inlet_mask_zyx"],
              outlet_mask_zyx=room["outlet_mask_zyx"],
          )
          assert room_wind["inlet_cell_count"] == room["inlet_cell_count"]
          assert room_wind["outlet_cell_count"] == room["outlet_cell_count"]
          assert np.allclose(room_wind["temperature"][:, :, 0][room["inlet_mask_zyx"][:, :, 0]], 38.0)
          
          # Imported watertight cube is removed from the room air cells.
          cube_vertices = np.array([
              [2,1,1],[4,1,1],[4,3,1],[2,3,1],
              [2,1,2],[4,1,2],[4,3,2],[2,3,2],
          ], dtype=float)
          cube_faces = np.array([
              [0,2,1],[0,3,2],[4,5,6],[4,6,7],
              [0,1,5],[0,5,4],[1,2,6],[1,6,5],
              [2,3,7],[2,7,6],[3,0,4],[3,4,7],
          ], dtype=int)
          room_with_solid = subtract_solid_obstacle(room, cube_vertices, cube_faces)
          assert room_with_solid["solid_cell_count"] > 0
          assert room_with_solid["active_cell_count"] < room["active_cell_count"]
          assert room_with_solid["inside_mask_zyx"].shape == room["inside_mask_zyx"].shape


          def cancellable(progress_callback=None, cancel_event=None):
              for i in range(100000):
                  if cancel_event.is_set():
                      from physics.worker import SolverCancelled
                      raise SolverCancelled("cancelled")
                  if progress_callback and i % 100 == 0:
                      progress_callback(i, 100000, None)
                  time.sleep(0.0001)
              return True

          job_id = submit_job("cancel-smoke", cancellable)
          cancel_job(job_id)
          for _ in range(100):
              job = get_job(job_id)
              if job["status"] in ("cancelled", "completed", "failed"):
                  break
              time.sleep(0.02)
          assert job["status"] == "cancelled", job
          print("2D/3D solver, structured mesh, voxel volume mesh, and worker cancellation: PASS")
          PY
